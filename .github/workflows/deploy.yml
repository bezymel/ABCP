name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main # Срабатывает при пуше в main
  workflow_dispatch: # Позволяет запускать вручную кнопкой в Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Синхронизируем файлы с Yandex Object Storage
      - name: Sync files to Yandex Cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          # Если файлы лежат в корне репозитория:
          aws s3 sync ./new.abcp-master-site s3://abcp-master.ru \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control "no-cache, must-revalidate" \
            --delete
